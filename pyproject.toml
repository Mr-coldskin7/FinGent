[project]
name = "fingent"
version = "0.1.0"
description = "FinGent - 金融智能 Agent 多 Agent 协同分析系统"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── LLM / Agent 编排 ──────────────────────────────────────────────
    "langchain==1.2.2",
    "langchain-core==1.2.17",
    "langchain-openai==1.1.7",
    "langgraph==1.0.5",
    "langgraph-checkpoint==3.0.1",
    "langgraph-prebuilt==1.0.5",   # 必须与 langgraph 1.0.5 配套，否则 tool_node 导入 ExecutionInfo 失败
    "langgraph-sdk==0.3.1",
    "langgraph-checkpoint-redis==0.2.0",   # Redis checkpoint（可选启用，见 FINGENT_CHECKPOINTER）
    "openai==2.14.0",
    # ── Web 服务 ─────────────────────────────────────────────────────
    "fastapi==0.133.0",
    "uvicorn==0.38.0",
    "sse-starlette==3.3.2",
    "python-dotenv==1.2.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    # ── 数据源 ───────────────────────────────────────────────────────
    "akshare==1.17.93",                    # A 股
    "yfinance==0.2.66",                    # 美股
    "pandas==2.3.3",
    "numpy==2.2.6",
    "httpx==0.28.1",                       # web_search / Tiingo
    "requests==2.32.5",
    # ── 存储 / 记忆 ──────────────────────────────────────────────────
    "aiosqlite==0.22.1",                   # L3 长期记忆 (SQLite)
    "redis==6.4.0",                        # L1 对话记忆缓存（无 Redis 时自动降级）
    "deepagents>=0.3.3",
]

[dependency-groups]
rag = [
    "chromadb==1.3.5",
    "sentence-transformers==5.1.2",
    "torch",                               # macOS arm64 自动装 CPU 版
    "datasets==4.6.1",                     # RAG/build_db.py 拉取数据集
]
backtest = [
    "backtrader==1.9.78.123",
]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio>=0.24,<2",  # 版本号以实际可解析为准
    "black==25.12.0",
]

[tool.uv]
package = false                     # 项目不可安装为包，仅管理环境

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["Test"]

[tool.ruff]
# 代码质量基线：只强制"真问题"类规则（语法/未定义/未使用/明显缺陷），风格类不做硬性要求。
extend-exclude = ["RAG/models", "Frontend", "Eval/runs"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = [
    "B905",  # zip() 无 strict：项目内数据长度已受控，不强制
]
