version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: fingent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fingent123
      MYSQL_DATABASE: fingent
    ports:
      - "3333:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: fingent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fingent_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MYSQL_URL=mysql+pymysql://root:fingent123@mysql:3306/fingent
      - REDIS_URL=redis://redis:6379
      - QIANWEN_API_KEY=${QIANWEN_API_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - TIINGO_API_KEY=${TIINGO_API_KEY}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Data:/app/Data

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fingent_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
